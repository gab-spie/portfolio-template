<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141210'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4efe6;
    --surface: #fbf8f2;
    --ink: #141210;
    --muted: #6b645a;
    --line: rgba(20, 18, 16, 0.1);
    --line-strong: rgba(20, 18, 16, 0.2);
    --accent-ink: #b8430f;
    --shadow: 0 1px 2px rgba(40, 28, 12, 0.05), 0 18px 40px -20px rgba(40, 28, 12, 0.25);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  }

  :root[data-theme="dark"] {
    --bg: #22211e; --surface: #2c2a27; --ink: #f1ece3; --muted: #aaa397;
    --line: rgba(241, 236, 227, 0.12); --line-strong: rgba(241, 236, 227, 0.22);
    --accent-ink: #ff8c58;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 18px 40px -20px rgba(0, 0, 0, 0.6);
  }
  :root[data-theme="dark"] .mq-row img.mono,
  :root[data-theme="dark"] .item img.mono { filter: invert(1); }
  :root[data-theme="dark"] .chain .logos img.mono-dark,
  :root[data-theme="dark"] .routine .item-logos img.mono { background: #f4efe6; border-color: transparent; }

  /* choix du thème */
  .theme { position: fixed; top: 16px; right: 70px; z-index: 30; display: flex; gap: 2px; padding: 3px; height: 46px; border-radius: 12px; background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--line-strong); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background 0.9s ease, border-color 0.9s ease; }
  .theme button { appearance: none; border: 0; background: none; width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; cursor: pointer; color: var(--muted); transition: color 0.3s, background 0.3s; }
  .theme button:hover { color: var(--ink); }
  .theme button[aria-pressed="true"] { background: var(--line); color: var(--ink); }
  body.dark-band .theme { background: rgba(20, 18, 16, 0.85); border-color: rgba(255, 255, 255, 0.3); }
  body.dark-band .theme button { color: rgba(255, 255, 255, 0.6); }
  body.dark-band .theme button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.14); color: #fff; }
  @media (max-width: 600px) { .theme { top: 10px; right: 58px; height: 40px; padding: 2px; border-radius: 10px; } .theme button { width: 34px; height: 34px; } }
  @media print { .theme { display: none !important; } }

  *, *::before, *::after { box-sizing: border-box; }
  html { overflow-x: clip; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 0px; }
  body { transition: background-color 0.9s ease, color 0.9s ease; margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--font); -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; height: auto; }
  a { color: inherit; }
  ::selection { background: #141210; color: #f4efe6; }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 4px; }
  .btn:focus-visible, .skip:focus-visible { outline-color: var(--ink); }
  .skip { position: absolute; left: 16px; top: -48px; z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; text-decoration: none; }
  .skip:focus { top: 16px; }
  .container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  main { position: relative; z-index: 1; }

  /* hero */
  header.hero.container { padding-top: clamp(64px, 9svh, 96px); padding-bottom: clamp(36px, 6svh, 72px); min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-start; }
  h1.name { font-weight: 800; font-size: clamp(3.2rem, 12.6vw, 10.6rem); line-height: 0.9; letter-spacing: -0.055em; margin: 0 0 30px; white-space: nowrap; }
  .kicker-top { font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.6rem); letter-spacing: -0.04em; line-height: 1.1; margin: 0 0 6px; color: var(--muted); }
  h1.name .w { display: inline-block; white-space: nowrap; }
  h1.name .l { display: inline-block; transition: color 0.3s; }
  h1.name .l:hover { color: var(--accent-ink); }
  .js h1.name .l { opacity: 0; transform: translate(var(--x, 0), var(--y, 0)) rotate(var(--r, 0)); }
  .js h1.name.go .l { opacity: 1; transform: none; transition: opacity 0.6s var(--ease), transform 1.1s var(--ease), color 0.3s; transition-delay: calc(var(--i) * 38ms), calc(var(--i) * 38ms), 0s; }
  /* effet IA / AI : les deux lettres passent en rouge, une flèche les relie au mot marqué (ou écrit « IA » à la main) */
  .js h1.name.go.ai-on .l.pair, h1.name.ai-on .l.pair { color: var(--ai); transform: translateY(-0.07em); transition: color 0.3s, transform 0.4s var(--ease); transition-delay: 0s; }
  h1.name.ai-on .l:not(.pair) { color: inherit; }
  header.hero { position: relative; --ai: #d61f1f; }
  :root[data-theme="dark"] header.hero { --ai: #ff3b3b; }
  .ai-link { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
  .ai-link path { fill: none; stroke: var(--ai); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ai-link .ai-line { stroke-dasharray: var(--len, 1000); stroke-dashoffset: var(--len, 1000); transition: stroke-dashoffset 0.25s ease; }
  .ai-link.rev .ai-line { stroke-dashoffset: calc(var(--len, 1000) * -1); }
  .ai-link .ai-line2, .ai-link .ai-hand { stroke-dasharray: var(--l, 400); stroke-dashoffset: var(--l, 400); transition: stroke-dashoffset 0.2s ease; }
  .ai-link .ai-head { opacity: 0; transition: opacity 0.15s; }
  .ai-link.no-anim path { transition: none !important; }
  .hero.ai-show .ai-link .ai-line { stroke-dashoffset: 0; transition: stroke-dashoffset 0.75s cubic-bezier(.6,0,.3,1); }
  .hero.ai-show .ai-link .ai-line2 { stroke-dashoffset: 0; transition: stroke-dashoffset 0.35s ease-out 0.7s; }
  .hero.ai-show .ai-link .ai-hand { stroke-dashoffset: 0; transition: stroke-dashoffset var(--t) ease-in-out var(--d); }
  .hero.ai-show .ai-link .ai-head { opacity: 1; transition: opacity 0.2s 0.65s; }
  .hero.ai-show .ai-link.rev .ai-head { transition: opacity 0.2s 1s; }
  .lead .ai-word { transition: color 0.3s; cursor: default; }
  .hero.ai-show .lead .ai-word { color: var(--ai); }
  @media print { .ai-link { display: none; } }
  .hero-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 40px; align-items: end; }
  .lead { font-size: clamp(1.2rem, min(2.3vw, 3.4svh), 2.05rem); line-height: 1.35; letter-spacing: -0.015em; margin: 0; max-width: 32ch; }
  .side { --ph: clamp(244px, 38svh, 400px); display: grid; grid-template-columns: var(--ph) minmax(0, 1fr); gap: 0 30px; align-items: end; }
  .side .me { grid-row: 1 / span 4; width: var(--ph); height: calc(var(--ph) * 1.25); object-fit: cover; border-radius: 14px; box-shadow: var(--shadow); transform: rotate(-3deg); transition: transform 0.6s var(--ease); position: relative; overflow: hidden; }
  .side .me:hover { transform: rotate(0deg) scale(1.04); }
  .side .me::before { content: ""; position: absolute; inset: -20% 0; z-index: 1; pointer-events: none; mix-blend-mode: screen; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,0.22) 50%, transparent 65%); transform: translateX(-120%); }
  .side .me:hover::before { animation: sheen 1.1s var(--ease); }
  @keyframes sheen { to { transform: translateX(120%); } }
  .side .me img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .side p { color: var(--muted); margin: 0 0 16px; max-width: 42ch; font-size: clamp(1rem, min(1.3vw, 2svh), 1.2rem); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; grid-column: 2; }
  .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 6px 6px 18px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.95rem; background: var(--ink); color: var(--bg); transition: transform 0.35s var(--ease); }
  .btn .ico { width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.14); transition: transform 0.4s var(--ease); }
  .btn:hover .ico { transform: translateY(3px); }
  .btn:active { transform: scale(0.97); }

  /* bande de captures */
  .ticker { position: relative; overflow: hidden; cursor: grab; touch-action: pan-y; -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }
  .ticker.drag { cursor: grabbing; }
  .ticker-track { display: flex; align-items: center; gap: 22px; width: max-content; padding: 34px 0 40px; will-change: transform; }
  .shot { margin: 0; flex: none; user-select: none; transition: transform 0.6s var(--ease); transform: rotate(var(--sr, 0deg)) translateY(var(--sy, 0px)); }
  .shot:hover { transform: rotate(0) scale(1.03); }
  .shot .frame { height: calc(clamp(200px, 26vw, 310px) * var(--sh, 1)); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); background: var(--surface); }
  .shot img { height: 100%; width: auto; max-width: none; pointer-events: none; }
  .shot figcaption { font-size: 0.82rem; color: var(--muted); margin-top: 10px; display: flex; align-items: center; gap: 8px; }

  /* phrase qui s'allume au défilement */
  .statement { padding: clamp(80px, 12vw, 160px) 0 clamp(60px, 8vw, 100px); }
  .statement p { font-weight: 700; font-size: clamp(1.8rem, 4.4vw, 3.6rem); line-height: 1.12; letter-spacing: -0.035em; margin: 0; max-width: 22ch; }
  .statement .wd { opacity: 0.13; transition: opacity 0.2s linear; }

  /* projets en cartes qui s'empilent */
  .section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 40px; margin-bottom: 28px; }
  h2 { font-weight: 800; font-size: clamp(2rem, 4.4vw, 3.4rem); letter-spacing: -0.04em; line-height: 1; margin: 0; }
  .section-head p { color: var(--muted); margin: 0; max-width: 46ch; }

  .card .card-grid { width: 100%; }
  .card .media img { max-height: 72svh; object-fit: contain; }
  .cards { display: grid; gap: 0; margin: 0 calc(50% - 50vw); padding: 0 max(24px, calc((100vw - 1320px) / 2)); overflow-x: clip; }

  .js .card .card-grid > * { opacity: 0; transform: translateY(40px); transition: opacity 0.9s var(--ease), transform 0.9s var(--ease); }
  .js .card .card-grid > .media { transform: translateY(70px) scale(0.94); transition-delay: 0.12s; }
  .js .card.on .card-grid > * { opacity: 1; transform: none; }
  .card { --c-bg: var(--cl-bg, #141414); --c-ink: var(--cl-ink, #f5f1ea); --c-accent: var(--cl-accent, #ff6a2b);
    position: relative; min-height: 100svh; display: flex; align-items: center; padding: clamp(28px, 5svh, 64px) max(24px, calc((100vw - 1320px) / 2)); margin: 0 calc(-1 * max(24px, calc((100vw - 1320px) / 2))); color: var(--c-ink);
    }
  :root[data-theme="dark"] .card { --c-bg: var(--cd-bg, var(--cl-bg, #141414)); }
  .card-grid { position: relative; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.5fr); gap: clamp(32px, 5vw, 80px); align-items: center; height: 100%; }
  .card h3 { font-weight: 800; font-size: clamp(1.6rem, min(3vw, 5svh), 2.6rem); line-height: 1.02; letter-spacing: -0.04em; margin: 0 0 clamp(8px, 1.6svh, 16px); text-wrap: balance; }
  .card h3 em { font-style: normal; color: var(--c-accent); }
  .card .pitch { font-size: clamp(0.92rem, 1.9svh, 1.04rem); line-height: 1.5; margin: 0 0 clamp(10px, 2svh, 18px); max-width: 46ch; opacity: 0.86; }
  .card .result { font-weight: 800; font-size: clamp(1.05rem, min(1.7vw, 2.8svh), 1.4rem); line-height: 1.22; letter-spacing: -0.02em; color: var(--c-accent); margin: 0 0 clamp(10px, 2svh, 18px); max-width: 32ch; }
  .card ul { margin: 0 0 clamp(10px, 2svh, 18px); font-size: clamp(0.88rem, 1.8svh, 1rem); line-height: 1.45; padding: 0; list-style: none; }
  .card li { position: relative; padding-left: 22px; margin-bottom: clamp(3px, 0.8svh, 8px); max-width: 54ch; opacity: 0.8; }
  .card li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 9px; height: 9px; border-radius: 3px; background: var(--c-accent); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px 20px; }
  .tools span { font-size: 0.86rem; opacity: 0.8; display: inline-flex; align-items: center; }
  .media { position: relative; perspective: 1200px; }
  .tilt { border-radius: 16px; overflow: hidden; box-shadow: 0 30px 60px -28px rgba(0, 0, 0, 0.7); transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--zs, 1)); transition: transform 0.25s ease-out; transform-style: preserve-3d; }
  .tilt img { width: 100%; }
  .media .float { position: absolute; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 48px -20px rgba(0, 0, 0, 0.75); border: 3px solid var(--c-bg); animation: bob 6s ease-in-out infinite; }
  .media .float.a { width: 42%; left: -6%; bottom: -10%; }
  .media .float.b { width: 38%; right: -4%; top: -12%; animation-delay: -3s; }
  .media .float.phone { width: 30%; right: -3%; bottom: -12%; border-radius: 18px; }
  @keyframes bob { 50% { transform: translateY(-12px) rotate(0.6deg); } }
  .numbers { display: grid; gap: 3px; margin-top: 10px; padding-left: 14px; border-left: 2px solid var(--c-accent); }
  .numbers span { font-size: 0.95rem; }
  .numbers b { color: var(--c-accent); font-weight: 800; }

  /* bande des outils */
  .marquee { padding: clamp(70px, 9vw, 120px) 0 30px; overflow: hidden; }
  .mq-row { display: flex; width: max-content; gap: 56px; padding: 7px 0; will-change: transform; }
  .mq-row span { flex: none; display: inline-flex; align-items: center; font-weight: 800; font-size: clamp(1.6rem, 3.8vw, 3rem); letter-spacing: -0.04em; white-space: nowrap; }
  .mq-row[data-dir="1"] span { color: var(--muted); }

  /* clavier */
  section.container { padding-top: clamp(72px, 9vw, 112px); }
  .keys-wrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 44px; align-items: center; }
  .keyboard { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 22px; border-radius: 22px; background: linear-gradient(160deg, #2a2724, #141210); transform: perspective(1100px) rotateX(20deg) rotateZ(-2deg); transform-origin: bottom; box-shadow: 0 40px 60px -30px rgba(0, 0, 0, 0.6); }
  .key { appearance: none; border: 0; font: inherit; color: #141210; background: #f6f0e6; border-radius: 12px; min-height: 72px; padding: 10px 8px; font-size: 0.86rem; font-weight: 700; line-height: 1.2; cursor: pointer; box-shadow: 0 6px 0 #b9ad9a, 0 9px 14px -6px rgba(0, 0, 0, 0.5); transition: transform 0.14s var(--ease), box-shadow 0.14s var(--ease), background 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .key:hover, .key:focus-visible, .key.on { transform: translateY(5px); box-shadow: 0 1px 0 #b9ad9a, 0 3px 6px -3px rgba(0, 0, 0, 0.5); background: #fffaf2; }
  .key.on { outline: 2px solid #f6f0e6; outline-offset: 2px; }
  .key.wide { grid-column: span 2; }
  .key-info { min-height: 170px; }
  .key-info .k { font-size: 0.85rem; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
  .key-info h4 { font-size: clamp(1.8rem, 3vw, 2.4rem); font-weight: 800; letter-spacing: -0.035em; margin: 0 0 10px; }
  .key-info p.t { margin: 0; color: var(--muted); font-size: 1.05rem; max-width: 40ch; }
  .key-info .swap { animation: swap 0.45s var(--ease); }
  @keyframes swap { from { opacity: 0; transform: translateY(10px); } }

  /* autres projets */
  .bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-flow: dense; gap: 14px; }
  .item { grid-column: span 3; position: relative; display: flex; flex-direction: column; padding: 26px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease); }
  .item:hover { transform: translateY(-4px) rotate(-0.4deg); box-shadow: var(--shadow); }
  .item.xl { grid-column: span 4; }
  .item.sm { grid-column: span 2; }
  .item.full { grid-column: span 6; }
  .item > * { position: relative; z-index: 1; }
  .item .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: -8px -8px 18px; }
  .item .thumbs > * { display: block; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 10; background: #141210; }
  .item .thumbs img { width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform 0.6s var(--ease); }
  .item .thumbs > *:hover img { transform: scale(1.05); }
  .item .thumbs.one { grid-template-columns: 1fr; }
  .item .thumbs.wide > * { aspect-ratio: 1510 / 650; background: #f7f7f7; }
  .item .thumbs.wide img { object-fit: contain; }
  .item .thumbs.side-img { position: absolute; top: 18px; right: 18px; bottom: 18px; width: 34%; margin: 0; }
  .item .thumbs.side-img > * { aspect-ratio: auto; height: 100%; }
  .item:has(.side-img) > :not(.thumbs) { max-width: 60%; }
  @media (max-width: 760px) {
    .item .thumbs.side-img { position: static; width: auto; margin: -8px -8px 18px; }
    .item .thumbs.side-img > * { aspect-ratio: 16 / 10; height: auto; }
    .item:has(.side-img) > :not(.thumbs) { max-width: none; }
  }
  .item h4 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }
  .item p { color: var(--muted); font-size: 0.96rem; margin: 0 0 18px; max-width: 54ch; }
  .item .foot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .item .tags { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .item .tags span { font-size: 0.86rem; color: var(--muted); display: inline-flex; align-items: center; }
  .item a.gh { font-size: 0.9rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
  .item a.gh:hover { color: var(--accent-ink); }

  /* contact */
  section.contact { padding-top: clamp(90px, 11vw, 140px); padding-bottom: 0; }
  .contact-box { position: relative; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 40px; align-items: center; padding: clamp(56px, 8vw, 110px) max(24px, calc(50vw - 566px)); margin: 0 calc(50% - 50vw); border-radius: 0; background: var(--ink); color: var(--bg); overflow: hidden; }
  .contact h2 { font-size: clamp(2rem, 4.6vw, 3.6rem); line-height: 1.02; text-wrap: balance; }
  .contact-links { display: grid; }
  .contact-links a { display: flex; justify-content: space-between; align-items: center; min-height: 52px; gap: 12px; border-bottom: 1.5px solid color-mix(in srgb, var(--bg) 20%, transparent); text-decoration: none; font-weight: 600; transition: padding 0.4s var(--ease); }
  .contact-links a:hover { padding-left: 8px; }
  footer.container { font-size: 0.85rem; color: color-mix(in srgb, var(--bg) 50%, transparent); background: var(--ink); max-width: none; width: auto; margin: 0 calc(50% - 50vw); padding: 0 max(24px, calc(50vw - 566px)) 40px; }
  @media print { footer.container { background: none; color: #6b645a; margin: 0; padding: 12pt 0; } }


  /* logos */
  img.lg { display: inline-block; width: 1em; height: 1em; object-fit: contain; vertical-align: -0.15em; margin-right: 0.4em; }
  .mq-row span img.lg { width: 0.85em; height: 0.85em; margin-right: 0.3em; }
  .card img.mono { filter: invert(1); }
  .key img.kl { width: 24px; height: 24px; object-fit: contain; }
  .brand-logo { height: 24px; width: auto; margin-bottom: clamp(10px, 2svh, 20px); opacity: 0.95; }

  /* balises de la page : titre, description, partage, icône */
  function meta(C, nom) {

      if (!val) return;

    var desc = fr(site.description);
    document.title = title;
    setMeta('name', 'description', desc);
    setMeta('property', 'og:title', title);
    setMeta('property', 'og:description', desc);
    setMeta('property', 'og:type', 'website');
    if (base) setMeta('property', 'og:url', base);
    if (ip) {
      var abs = /^https?:/.test(ip) ? ip : base + ip.replace(/^\.?\//, '');

      setMeta('name', 'twitter:card', 'summary_large_image');

    var ini = ((fr(id.prenom) || ' ')[0] + (fr(id.nom) || ' ')[0]).trim().toUpperCase();
    if (ini) {
      var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='#141210'/><text x='16' y='21.5' text-anchor='middle' font-family='system-ui,-apple-system,sans-serif' font-size='14' font-weight='700' letter-spacing='-0.5' fill='#f4efe6'>" + esc(ini) + "</text></svg>";
      var ic = document.head.querySelector('link[rel="icon"]');
      if (!ic) { ic = document.createElement('link'); ic.rel = 'icon'; document.head.appendChild(ic); }
      ic.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
    }
  }

  /* ============================================================

  // effet IA / AI : une paire i puis a (IA) ou a puis i (AI) dans le nom s'allume, et une flèche la relie au mot [[IA]] de l'accroche
  function aiEffect(h1) {
    var letters = [].slice.call(h1.querySelectorAll('.l'));
    var base = letters.map(function (l) { return l.textContent.normalize('NFD').charAt(0).toLowerCase(); });
    // les deux lettres les plus proches, dans un même mot ou d'un mot à l'autre
    var find = function (a, b) {
      var best = null;
      base.forEach(function (c, j) {
        var k = c === a ? base.indexOf(b, j + 1) : -1;
        if (k > 0 && (!best || k - j < best[2])) best = [letters[j], letters[k], k - j];
      });
      return best && best.slice(0, 2);
    };
    var IA = find('i', 'a'), AI = find('a', 'i');
    if (!IA && !AI) return; // pas de paire : les a et i restent des lettres comme les autres
    var hero = h1.closest('header.hero'), svg = hero.querySelector('.ai-link');
    var line = svg.querySelector('.ai-line'), line2 = svg.querySelector('.ai-line2'), head = svg.querySelector('.ai-head');
    // une seule paire trouvée : on l'utilise dans les deux langues
    var pair = function () { return root.lang === 'en' ? AI || IA : IA || AI; };
    function draw() {
      var word = hero.querySelector('.lead .ai-word'), p = pair(), rev = svg.classList.contains('rev');
      letters.forEach(function (l) { l.classList.toggle('pair', p.indexOf(l) >= 0); });
      svg.querySelectorAll('.ai-hand').forEach(function (e) { e.remove(); });
      var hb = hero.getBoundingClientRect(), r0 = p[0].getBoundingClientRect(), r1 = p[1].getBoundingClientRect();
      var rg = document.createRange(); rg.selectNodeContents(h1); var hr = rg.getBoundingClientRect();
      var X = function (v) { return v - hb.left; }, Y = function (v) { return v - hb.top; };
      // 1. les deux lettres reliées par en dessous
      var p0 = { x: X(r0.left + r0.width / 2), y: Y(r0.bottom) + 6 }, p1 = { x: X(r1.left + r1.width / 2), y: Y(r1.bottom) + 6 };
      var smile = 'M' + p0.x + ' ' + p0.y + ' Q' + ((p0.x + p1.x) / 2) + ' ' + (Math.max(p0.y, p1.y) + 18) + ' ' + p1.x + ' ' + p1.y;
      var d = rev ? 'M' + p0.x + ' ' + p0.y : smile, cur = rev ? p0 : p1, back = false, ex, ey, ang, k = 11;
      if (!word) {
        // pas de mot marqué : la flèche écrit « IA » (ou « AI ») à la main, à droite de la 2e lettre, au-dessus de la ligne
        var fs = parseFloat(getComputedStyle(h1).fontSize), gh = Math.max(18, fs * 0.26), txt = root.lang === 'en' ? 'AI' : 'IA';
        var W = gh * 1.3, x0 = X(r1.right) + fs * 0.04, by = Y(r1.top) + fs * 0.1;
        var kb = hero.querySelector('.kicker-top').getBoundingClientRect();
        if (x0 < X(kb.right) + 8 && by - gh < Y(kb.bottom)) x0 = X(kb.right) + 10;
        x0 = Math.min(x0, hb.width - W - 4);
        var P = function (px, py) { return (x0 + (px + py * 0.18) * gh).toFixed(1) + ' ' + (by - py * gh).toFixed(1); };

        btn.textContent = l === 'en' ? 'FR' : 'EN';
        btn.setAttribute('aria-label', l === 'en' ? UI.toFr : UI.toEn);
        document.title = titles[l];
        // textes de l'interface
        var u = function (o) { return o[l]; };
        document.querySelector('.skip').textContent = u(UI.skip);
        var th = document.querySelector('.theme'); th.setAttribute('aria-label', u(UI.theme));
        th.querySelectorAll('button').forEach(function (b) { var t = u(UI[b.dataset.t]); b.setAttribute('aria-label', t); b.title = t; });
        var tkEl = document.querySelector('[data-ui-label="ticker"]'); if (tkEl) tkEl.setAttribute('aria-label', u(UI.ticker));
        var tlEl = document.querySelector('[data-ui-label="tools"]'); if (tlEl) tlEl.setAttribute('aria-label', u(UI.tools));
        try { localStorage.setItem('lang', l); } catch (e) {}
      }
      var q = new URLSearchParams(location.search).get('lang'), saved = null;
      try { saved = localStorage.getItem('lang'); } catch (e) {}
      var def = site.langueParDefaut === 'fr' || site.langueParDefaut === 'en' ? site.langueParDefaut : ((navigator.language || 'fr').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en');
      // bouton masqué (site dans une seule langue) : on ne reprend pas une langue mémorisée
      if (site.boutonLangue === false) saved = null;
      var start0 = q === 'en' || q === 'fr' ? q : (saved === 'en' || saved === 'fr' ? saved : def);
      if (site.boutonLangue === false) btn.hidden = true;
      apply(start0 === 'en' ? 'en' : 'fr');
      keys[0] && show(keys[0]);
      btn.addEventListener('click', function () { apply(root.lang === 'en' ? 'fr' : 'en'); });
    })();

    // thème : clair, sombre ou comme l'appareil
    (function () {
      var bs = document.querySelectorAll('.theme button');
      function sync() { var p = root.dataset.themePref; bs.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.t === p ? 'true' : 'false'); }); }
      bs.forEach(function (b) { b.addEventListener('click', function () { window.__setTheme(b.dataset.t); }); });
      document.addEventListener('themechange', sync); sync();
    })();

    // défilement doux vers les projets
    if (!reduce) {
      var ease = function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
      document.addEventListener('click', function (e) {
        var a = e.target.closest('a[href^="#"]'); if (!a) return;
        var sel = a.getAttribute('href'); if (sel.length < 2) return;
        var el; try { el = document.querySelector(sel); } catch (err) { return; }
        if (!el) return;
        e.preventDefault();
        var y0 = scrollY, y1 = el.getBoundingClientRect().top + scrollY, d = y1 - y0;
        var dur = Math.min(1600, Math.max(900, Math.abs(d) * 0.9)), t0 = null;
        var prev = root.style.scrollBehavior; root.style.scrollBehavior = 'auto';
        var stop = false, cancel = function () { stop = true; };
        addEventListener('wheel', cancel, { passive: true, once: true }); addEventListener('touchstart', cancel, { passive: true, once: true });
        requestAnimationFrame(function step(nw) {
          if (stop) { root.style.scrollBehavior = prev; return; }
          if (t0 === null) t0 = nw; var t = Math.min(1, (nw - t0) / dur);
          scrollTo(0, y0 + d * ease(t));
          if (t < 1) requestAnimationFrame(step); else { root.style.scrollBehavior = prev; history.replaceState(null, '', sel); }
        });
      });
    }
  }

  /* ============================================================
     5. Démarrage
     ============================================================ */
  var loaded = false;
  load().then(function (C) {
    loaded = true;
    build(C);
    start(C);
  }).catch(function (err) {
    document.getElementById('contenu').innerHTML =
      '<div class="container" style="padding-top:120px"><h1>' + (loaded || err.invalid ? 'Erreur dans contenu.json' : 'contenu.json introuvable') + '</h1>' +
      '<p>Vérifie que le fichier <code>contenu.json</code> est à côté de <code>index.html</code> et qu\'il est valide.</p>' +
      '<p>Si tu ouvres la page directement (sans serveur), lance <code>python3 sync-contenu.py</code> pour générer <code>contenu.js</code>.</p></div>';
    if (window.console) console.error(err);
  });
})();

</script>
